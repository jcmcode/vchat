# vchat on one server: Caddy (HTTPS + static app), the signaling server, and a coturn relay.
# No container keeps logs (logging driver "none"); see DOCS.md → "Debugging with logs" to turn them
# on temporarily. The relay on port 443 (TURN over TLS) is an opt-in add-on on top of this file:
# docker-compose.turn-tls.yml.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - signaling
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 200
    logging:
      driver: none

  signaling:
    build:
      context: .
      dockerfile: packages/signaling-server/Dockerfile
    expose:
      - "3001"
    environment:
      - PORT=3001
      - ALLOWED_ORIGIN=https://${DOMAIN}
      # STUN from our own coturn, so browsers contact no third party.
      - STUN_URLS=stun:${DOMAIN}:3478
      # Short-lived TURN credentials for coturn (TURN REST API / use-auth-secret)
      - TURN_URLS=turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
      - TURN_SECRET=${TURN_SECRET}
      # Private mode: the owner signs in at /admin and sends invite links. If ADMIN_PASSWORD is
      # missing, empty or short, the server reports a configuration error instead of running open
      # (SECRET_KEY is always set here, and that alone rules out open mode).
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Optional: Cloudflare Access instead of the password (run behind a Cloudflare Tunnel).
      # Empty means unset.
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      # Optional: email sign-in codes and emailed invites via Resend. Empty means unset.
      - OWNER_EMAIL=${OWNER_EMAIL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100
    logging:
      driver: none

  coturn:
    # Pinned by digest; DOCS.md → "Updating pinned images" explains how to move it forward.
    image: coturn/coturn:4.19.0@sha256:0a3c026baaab092c79c9005823a72747bd09bf211071d537bb0865d95eae4638
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/run
      - /tmp
      - /var/tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200
    # No logs: coturn's own logging is off, and Docker keeps nothing either.
    logging:
      driver: none

volumes:
  caddy_data:
  caddy_config:
