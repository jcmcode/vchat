services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
      - BASIC_AUTH_HASH=${BASIC_AUTH_HASH}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - signaling
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  signaling:
    build:
      context: .
      dockerfile: packages/signaling-server/Dockerfile
    expose:
      - "3001"
    environment:
      - PORT=3001
      - ALLOWED_ORIGIN=https://${DOMAIN}
      # Short-lived TURN credentials for coturn (TURN REST API / use-auth-secret)
      - TURN_URLS=turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp,turns:${DOMAIN}:5349?transport=tcp
      - TURN_SECRET=${TURN_SECRET}
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - caddy_data:/caddy-data:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
